name: griya_jawa_3
description: "Aplikasi Super App Griya Jawa 3"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0 # Jika ini error, sesuaikan dengan versi dart di komputermu (misal ^3.1.0)

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # --- TAMBAHAN DEPENDENCIES KITA ---
  flutter_riverpod: ^2.5.1    # State management untuk Switch Tema
  go_router: ^14.1.4          # Navigasi dari Splash ke Dashboard
  flutter_dotenv: ^5.1.0      # Membaca file .env
  supabase_flutter: ^2.5.0    # Koneksi ke Supabase
  google_fonts: ^6.2.1        # Font Poppins

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # --- TAMBAHAN ASSETS KITA ---
  assets:
    - .env                    # Wajib didaftarkan di sini
    - assets/images/          # Folder untuk logo-pkp.png dan GRIYA_JAWA3.png